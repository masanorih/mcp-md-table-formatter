[project]
name = "md-table-formatter"
version = "0.1.0"
description = "MCP server to format Markdown tables with CJK-aware column alignment"
requires-python = ">=3.12"
dependencies = ["mcp>=2.0"]

[project.scripts]
md-table-formatter = "server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest"]
